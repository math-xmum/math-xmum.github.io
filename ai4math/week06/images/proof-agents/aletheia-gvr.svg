<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Aletheia generator verifier reviser loop</title>
  <desc id="desc">A natural-language research agent loop with generator, verifier, reviser, tool use, and final output.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b5cad" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16803a" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c96a00" />
    </marker>
    <style>
      .title { font: 700 25px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f2742; }
      .sub { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #526d82; }
      .label { font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f2742; }
      .small { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #26384f; }
      .tiny { font: 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #526d82; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .boxBlue { fill: #eef5ff; stroke: #0b5cad; stroke-width: 2; rx: 12; }
      .boxGreen { fill: #eef8f0; stroke: #16803a; stroke-width: 2; rx: 12; }
      .boxOrange { fill: #fff6ea; stroke: #c96a00; stroke-width: 2; rx: 12; }
      .boxRed { fill: #fff2f2; stroke: #cc2222; stroke-width: 2; rx: 12; }
      .tool { fill: #f7fbff; stroke: #8fb3dc; stroke-width: 1.8; rx: 999; }
      .edgeBlue { stroke: #0b5cad; stroke-width: 2.6; fill: none; marker-end: url(#arrowBlue); }
      .edgeGreen { stroke: #16803a; stroke-width: 2.6; fill: none; marker-end: url(#arrowGreen); }
      .edgeOrange { stroke: #c96a00; stroke-width: 2.4; fill: none; marker-end: url(#arrowOrange); }
      .ghost { stroke: #c7d3e0; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect x="16" y="16" width="1168" height="428" class="panel" />
  <text class="title" x="48" y="60">Aletheia: Generator, Verifier, Reviser</text>
  <text class="sub" x="48" y="85">A natural-language research agent, powered by Gemini Deep Think, search, and web browsing.</text>

  <rect x="44" y="120" width="220" height="86" class="boxBlue" />
  <text class="label" x="66" y="150">Problem</text>
  <text class="small" x="66" y="174">research question,</text>
  <text class="small" x="66" y="192">goal statement, literature</text>

  <rect x="44" y="228" width="220" height="78" class="boxOrange" />
  <text class="label" x="66" y="257">Tools</text>
  <text class="small" x="66" y="281">search, browsing,</text>
  <text class="small" x="66" y="299">calculation, citation lookup</text>

  <rect x="328" y="120" width="190" height="118" class="boxGreen" />
  <text class="label" x="352" y="150">Generator</text>
  <text class="small" x="352" y="174">proposes a candidate</text>
  <text class="small" x="352" y="192">solution in natural language</text>
  <text class="small" x="352" y="214">or a proof sketch</text>

  <rect x="612" y="114" width="216" height="130" class="boxRed" />
  <text class="label" x="638" y="144">Verifier</text>
  <text class="small" x="638" y="168">checks logic, citations,</text>
  <text class="small" x="638" y="186">and hidden assumptions</text>
  <text class="small" x="638" y="208">can reject or request repair</text>

  <rect x="500" y="286" width="216" height="96" class="boxOrange" />
  <text class="label" x="526" y="316">Reviser</text>
  <text class="small" x="526" y="340">patches the draft,</text>
  <text class="small" x="526" y="358">tightens arguments,</text>
  <text class="small" x="526" y="376">and tries again</text>

  <rect x="898" y="120" width="244" height="136" class="boxBlue" />
  <text class="label" x="924" y="150">Final output</text>
  <text class="small" x="924" y="175">accepted proof sketch,</text>
  <text class="small" x="924" y="193">research note, or paper draft</text>
  <text class="small" x="924" y="217">stops when verifier approves</text>
  <text class="small" x="924" y="239">or the budget runs out</text>

  <circle cx="397" cy="310" r="22" fill="#0b5cad" opacity="0.10" />
  <text class="tiny" x="372" y="315">Deep Think</text>

  <rect x="720" y="286" width="176" height="34" class="tool" />
  <text class="tiny" x="743" y="308">end-to-end in natural language</text>

  <path class="edgeBlue" d="M 264 164 L 326 164" />
  <path class="edgeOrange" d="M 154 228 L 154 208 L 329 208" />
  <path class="edgeBlue" d="M 518 176 L 610 176" />
  <path class="edgeGreen" d="M 828 176 L 896 176" />
  <path class="edgeOrange" d="M 612 318 C 560 300, 520 286, 494 254" />
  <path class="edgeBlue" d="M 500 180 C 470 214, 444 246, 420 286" />
  <path class="edgeGreen" d="M 612 316 C 682 292, 744 268, 818 236" />
  <path class="ghost" d="M 830 198 C 860 200, 874 201, 896 201" />

  <text class="tiny" x="492" y="108">generator-verifier-reviser loop</text>
</svg>
