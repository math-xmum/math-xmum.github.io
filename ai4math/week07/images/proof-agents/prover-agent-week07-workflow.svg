<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Prover-Agent workflow for Week 7</title>
  <desc id="desc">A local explanatory diagram showing theorem input, direct proof, Lean verification, repair, auxiliary lemma generation, lemma proving, and final synthesis.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0b5cad"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d26b00"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1a7f37"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f2742" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f6f9ff; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f2742; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526d82; }
      .box { fill: #ffffff; stroke: #c6d7ee; stroke-width: 2.2; rx: 14; filter: url(#shadow); }
      .box-blue { stroke: #0b5cad; }
      .box-green { stroke: #1a7f37; }
      .box-orange { stroke: #d26b00; }
      .box-red { stroke: #b42318; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f2742; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526d82; }
      .tiny { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526d82; }
      .code { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #20324a; }
      .arrow { fill: none; stroke: #0b5cad; stroke-width: 3.2; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #1a7f37; stroke-width: 3.2; marker-end: url(#arrow-green); }
      .arrow-orange { fill: none; stroke: #d26b00; stroke-width: 3.2; marker-end: url(#arrow-orange); }
      .dash { stroke-dasharray: 9 7; }
      .tag-blue { fill: #e8f1ff; stroke: #0b5cad; stroke-width: 1.5; }
      .tag-green { fill: #e9f8ed; stroke: #1a7f37; stroke-width: 1.5; }
      .tag-orange { fill: #fff4e6; stroke: #d26b00; stroke-width: 1.5; }
      .tag-red { fill: #fff1f0; stroke: #b42318; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="58">Prover-Agent: The Engineering Loop</text>
  <text class="subtitle" x="64" y="88">Prompted model outputs are useful only after Lean turns them into verified artifacts or actionable feedback.</text>

  <rect class="box box-blue" x="66" y="142" width="190" height="104"/>
  <text class="label" x="96" y="180">Target theorem</text>
  <text class="code" x="96" y="212">theorem ... := by</text>
  <text class="code" x="96" y="234">  sorry</text>

  <rect class="box box-blue" x="320" y="132" width="210" height="124"/>
  <text class="label" x="350" y="170">Direct proving</text>
  <text class="small" x="350" y="202">English proof</text>
  <text class="small" x="350" y="226">initial Lean proof</text>
  <text class="tiny" x="350" y="247">many candidates</text>

  <rect class="box box-green" x="590" y="132" width="210" height="124"/>
  <text class="label" x="620" y="170">Lean verifier</text>
  <text class="small" x="620" y="202">lake / REPL</text>
  <text class="small" x="620" y="226">Pantograph</text>
  <text class="tiny" x="620" y="247">accept or diagnose</text>

  <rect class="box box-orange" x="862" y="132" width="214" height="124"/>
  <text class="label" x="892" y="170">Repair prompt</text>
  <text class="small" x="892" y="202">failed code</text>
  <text class="small" x="892" y="226">error line + message</text>
  <text class="tiny" x="892" y="247">generate revision</text>

  <rect class="box box-green" x="1018" y="520" width="194" height="96"/>
  <text class="label" x="1046" y="558">Checked proof</text>
  <text class="small" x="1046" y="590">no errors, no sorry</text>
  <text class="small" x="1046" y="612">statement preserved</text>

  <rect class="box box-orange" x="320" y="404" width="210" height="126"/>
  <text class="label" x="350" y="442">Generate lemmas</text>
  <text class="small" x="350" y="474">subgoals</text>
  <text class="small" x="350" y="498">special cases</text>
  <text class="tiny" x="350" y="519">technique-inducing facts</text>

  <rect class="box box-orange" x="590" y="404" width="210" height="126"/>
  <text class="label" x="620" y="442">Prove lemmas</text>
  <text class="small" x="620" y="474">formalize statement</text>
  <text class="small" x="620" y="498">verify with Lean</text>
  <text class="tiny" x="620" y="519">keep only checked ones</text>

  <rect class="box box-blue" x="862" y="404" width="214" height="126"/>
  <text class="label" x="892" y="442">Final synthesis</text>
  <text class="small" x="892" y="474">target theorem</text>
  <text class="small" x="892" y="498">+ verified lemmas</text>
  <text class="tiny" x="892" y="519">then verify again</text>

  <path class="arrow" d="M256 194 H318"/>
  <path class="arrow" d="M530 194 H588"/>
  <path class="arrow-orange dash" d="M800 184 C828 168 838 168 860 184"/>
  <text class="tiny" x="813" y="150">error feedback</text>
  <path class="arrow-orange dash" d="M970 256 C960 310 525 332 430 402"/>
  <text class="tiny" x="672" y="326">if direct proof stalls</text>
  <path class="arrow-orange" d="M530 467 H588"/>
  <path class="arrow-green" d="M800 467 H860"/>
  <path class="arrow-green" d="M1076 467 C1138 468 1145 502 1128 520"/>
  <path class="arrow-green" d="M800 204 C895 292 984 386 1032 520"/>
  <text class="tiny" x="970" y="330">accepted direct proof</text>

  <rect class="tag-blue" x="70" y="632" width="210" height="42" rx="21"/>
  <text class="tiny" x="94" y="658">model proposes artifacts</text>
  <rect class="tag-orange" x="314" y="632" width="234" height="42" rx="21"/>
  <text class="tiny" x="338" y="658">errors change the next prompt</text>
  <rect class="tag-green" x="582" y="632" width="246" height="42" rx="21"/>
  <text class="tiny" x="606" y="658">verified lemmas become assets</text>
  <rect class="tag-red" x="862" y="632" width="280" height="42" rx="21"/>
  <text class="tiny" x="886" y="658">statement and sorry checks are external</text>
</svg>
